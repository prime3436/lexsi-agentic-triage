name: "TICKET TRIAGE"
id: "custom/ticket_triage"
version: "1.0.0"
description: "Property maintenance triage and SLA dispatch"
tags: ["triage", "routing"]

max_total_steps: 10

stages:
  - id: hazard_check
    type: llm_call
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    prompt: |
      Check for hazard in tenant report: {input_text}
      Return JSON: {"hazard_detected": true | false, "hazard_type": "gas_leak" | "electrical_arcing" | "water_flooding" | null}
    output_schema:
      type: object
      properties:
        hazard_detected: {type: boolean}
        hazard_type: {type: ["string", "null"]}
      required: [hazard_detected, hazard_type]
    temperature: 0.0
    max_tokens: 100
    next: classify

  - id: classify
    type: llm_call
    model: "Qwen/Qwen2.5-1.5B-Instruct"
    prompt: |
      Classify ticket and assign SLA: {input_text}
      Return JSON: {"category": string, "severity": "P1_CRITICAL"|"P2_HIGH"|"P3_MEDIUM"|"P4_LOW", "sla_hours": int, "specialty": string, "min_cost_inr": int, "max_cost_inr": int}
    output_schema:
      type: object
      properties:
        category: {type: string}
        severity: {type: string}
        sla_hours: {type: integer}
        specialty: {type: string}
        min_cost_inr: {type: integer}
        max_cost_inr: {type: integer}
      required: [category, severity, sla_hours, specialty, min_cost_inr, max_cost_inr]
    temperature: 0.0
    max_tokens: 180
    next: done

  - id: done
    type: output
    verdict_field: "classify.output.severity"
    next_stage_field: "classify.output.specialty"
    destinations: [file]

